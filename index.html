<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent IA Multilingue</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 10px; }
        #chat { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
        .user { text-align: right; color: blue; margin-bottom: 5px; }
        .bot { text-align: left; color: green; margin-bottom: 5px; }
        input, button { padding: 10px; font-size: 16px; }
        input { width: 60%; }
        button { width: 20%; background: #007bff; color: white; border: none; cursor: pointer; }
        #micBtn { width: 15%; background: #dc3545; }
    </style>
</head>
<body>
    <h1>Agent IA</h1>
    <div id="chat"></div>
    <input type="text" id="userInput" placeholder="Écrivez ou parlez...">
    <button onclick="sendMessage()">Envoyer</button>
    <button id="micBtn" onclick="startListening()">🎤 Parler</button>

    <script>
        // Votre clé Groq (celle qui commence par gsk_)
        const apiKey = "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"; 

        // Vos informations Supabase (celles que vous venez de copier)
        const SUPABASE_URL = "https://pfmgkdpvqqvlznogfuzi.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBmbWdrZHB2cXF2bHpub2dmdXppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4ODE2ODIsImV4cCI6MjEwNDQ1NzY4Mn0.KAgI6CBPW9URVG0cf9qn2t2GHsgmZNCwymkuLVgojlE";

        const chatDiv = document.getElementById('chat');
        const input = document.getElementById('userInput');
        let history = [];

        // 1. Charger l'historique depuis Supabase au démarrage
        async function loadHistory() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/messages?select=*&order=id.asc`, {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    }
                });
                const data = await response.json();
                
                // Afficher les messages existants
                data.forEach(msg => {
                    if (msg.role === "user") {
                        chatDiv.innerHTML += `<div class="user">Vous: ${msg.content}</div>`;
                    } else {
                        chatDiv.innerHTML += `<div class="bot">Agent: ${msg.content}</div>`;
                    }
                    history.push({ role: msg.role, content: msg.content });
                });
                chatDiv.scrollTop = chatDiv.scrollHeight;
            } catch (error) {
                console.log("Erreur chargement historique:", error);
            }
        }

        // 2. Sauvegarder un message dans Supabase
        async function saveMessage(role, content) {
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/messages`, {
                    method: "POST",
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`,
                        "Content-Type": "application/json",
                        "Prefer": "return=minimal"
                    },
                    body: JSON.stringify({ role: role, content: content })
                });
            } catch (error) {
                console.log("Erreur sauvegarde:", error);
            }
        }

        
            // 3. Envoyer un message et obtenir une réponse de l'IA (avec Permissions)
        async function sendMessage() {
            const userText = input.value;
            if (!userText) return;
            
            chatDiv.innerHTML += `<div class="user">Vous: ${userText}</div>`;
            input.value = '';
            
            history.push({ role: "user", content: userText });
            saveMessage("user", userText); // Sauvegarde

            // --- DÉBUT : LOGIQUE DES PERMISSIONS ET ACTIONS ---
            
            // 1. Définir le mot de passe vocal (Phrase secrète)
            const motDePasse = "code alpha"; 

            // 2. Définir les actions possibles
            if (userText.toLowerCase().includes("quelle heure") || userText.toLowerCase().includes("l'heure")) {
                const heure = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                const reponseAction = `Il est actuellement ${heure}.`;
                
                if (userText.toLowerCase().includes(motDePasse)) {
                    // Si le mot de passe est présent, on autorise
                    chatDiv.innerHTML += `<div class="bot">Agent: ${reponseAction}</div>`;
                    history.push({ role: "assistant", content: reponseAction });
                    saveMessage("assistant", reponseAction);
                    speakText(reponseAction);
                    chatDiv.scrollTop = chatDiv.scrollHeight;
                    return;
                } else {
                    // Si pas de mot de passe, on refuse poliment
                    const refus = "Désolé, cette action nécessite le mot de passe vocal. Dites 'Code alpha' avant votre demande.";
                    chatDiv.innerHTML += `<div class="bot" style="color:orange;">Agent: ${refus}</div>`;
                    history.push({ role: "assistant", content: refus });
                    saveMessage("assistant", refus);
                    speakText(refus);
                    chatDiv.scrollTop = chatDiv.scrollHeight;
                    return;
                }
            }
            
            // Action 2 : Donner la date
            if (userText.toLowerCase().includes("quelle date") || userText.toLowerCase().includes("aujourd'hui")) {
                const date = new Date().toLocaleDateString('fr-FR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                const reponseAction = `Nous sommes le ${date}.`;
                
                if (userText.toLowerCase().includes(motDePasse)) {
                    chatDiv.innerHTML += `<div class="bot">Agent: ${reponseAction}</div>`;
                    history.push({ role: "assistant", content: reponseAction });
                    saveMessage("assistant", reponseAction);
                    speakText(reponseAction);
                    chatDiv.scrollTop = chatDiv.scrollHeight;
                    return;
                } else {
                    const refus = "Désolé, cette action nécessite le mot de passe vocal. Dites 'Code alpha' avant votre demande.";
                    chatDiv.innerHTML += `<div class="bot" style="color:orange;">Agent: ${refus}</div>`;
                    history.push({ role: "assistant", content: refus });
                    saveMessage("assistant", refus);
                    speakText(refus);
                    chatDiv.scrollTop = chatDiv.scrollHeight;
                    return;
                }
            }

            // --- FIN : LOGIQUE DES PERMISSIONS ET ACTIONS ---

            // Si ce n'est pas une action spéciale, on utilise l'IA normale
            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-20b",
                        messages: [
                            { role: "system", content: "Tu es un assistant personnel. Si l'utilisateur parle en Darija (algérien), réponds en Darija avec les expressions locales. Si l'utilisateur parle en français, réponds en français. Si l'utilisateur parle en arabe, réponds en arabe. Sois naturel et amical." },
                            ...history
                        ]
                    })
                });

                if (!response.ok) throw new Error(`Erreur HTTP ${response.status}`);
                const data = await response.json();
                const botText = data.choices[0].message.content;
                
                chatDiv.innerHTML += `<div class="bot">Agent: ${botText}</div>`;
                history.push({ role: "assistant", content: botText });
                saveMessage("assistant", botText); // Sauvegarde
                speakText(botText);
                chatDiv.scrollTop = chatDiv.scrollHeight;

            } catch (error) {
                chatDiv.innerHTML += `<div class="bot" style="color:red;">Erreur: ${error.message}</div>`;
            }
        }
                // Fonction pour parler à voix haute
        function speakText(text) {
            // On annule toute lecture en cours pour éviter que les réponses se superposent
            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR'; // L'agent parle en français (il adaptera le ton pour le darija)
            utterance.rate = 1.0;     // Vitesse normale
            utterance.pitch = 1.0;    // Ton normal

            // Sélectionne une voix française si disponible
            const voices = window.speechSynthesis.getVoices();
            const frenchVoice = voices.find(voice => voice.lang.startsWith('fr'));
            if (frenchVoice) {
                utterance.voice = frenchVoice;
            }

            window.speechSynthesis.speak(utterance);
        }
        // 4. Fonction Microphone (Reconnaissance vocale)
        function startListening() {
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'fr-FR';
            recognition.start();

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                input.value = transcript;
                sendMessage();
            };

            recognition.onerror = function(event) {
                alert("Micro non autorisé ou erreur : " + event.error);
            };
        }

        // Charger l'historique dès que la page est ouverte
        window.onload = loadHistory;

        input.addEventListener("keypress", function(event) {
            if (event.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
