<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESSE</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Votre dégradé personnalisé */
            background-image: linear-gradient(to left bottom, #1e3c72, #1a477d, #145288, #0c5d93, #00689d);
            color: #fff;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            background-attachment: fixed; /* Pour que le dégradé reste fixe sur mobile */
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        #chat {
            /* Fond légèrement transparent pour laisser voir le dégradé */
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            height: 60vh;
            overflow-y: auto;
            padding: 20px;
            margin-bottom: 15px;
            backdrop-filter: blur(10px);
        }
        .user {
            text-align: right;
            /* Cyan assorti à la fin du dégradé */
            background: #0891b2; 
            color: white;
            padding: 10px 15px;
            border-radius: 15px 15px 0 15px;
            margin-bottom: 10px;
            display: inline-block;
            max-width: 80%;
            float: right;
            clear: both;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .bot {
            text-align: left;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 10px 15px;
            border-radius: 15px 15px 15px 0;
            margin-bottom: 10px;
            display: inline-block;
            max-width: 80%;
            float: left;
            clear: both;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 15px;
            border-radius: 25px;
            border: none;
            outline: none;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
        }
        button {
            padding: 0 20px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            color: white;
            font-size: 16px;
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.95);
        }
        /* Bouton Envoyer assorti au dégradé */
        #sendBtn {
            background: #145288;
        }
        #sendBtn:hover { background: #1a477d; }
        
        /* Bouton Micro reste rouge pour l'affordance (on sait que c'est pour parler/arrêter) */
        #micBtn {
            background: #dc3545;
            width: 60px;
        }
        #micBtn:hover { background: #c82333; }
    </style>
</head>
<body>
    <h1>ESSE</h1>
    <div id="chat"></div>
<div class="input-group">
    <input type="text" id="userInput" placeholder="Écrivez ou parlez...">
    <button id="sendBtn" onclick="sendMessage()">Envoyer</button>
    <button id="micBtn" onclick="startListening()">🎤</button>
</div>

    <script>
        // Vos informations Supabase (celles que vous avez copiées tout à l'heure)
        const SUPABASE_URL = "https://pfmgkdpvqqvlznogfuzi.supabase.co"
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBmbWdrZHB2cXF2bHpub2dmdXppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4ODE2ODIsImV4cCI6MjEwNDQ1NzY4Mn0.KAgI6CBPW9URVG0cf9qn2t2GHsgmZNCwymkuLVgojlE"; // Votre clé anon (celle qui commence par eyJ...)

        const chatDiv = document.getElementById('chat');
        const input = document.getElementById('userInput');
        let history = [];

        // 1. Charger l'historique depuis Supabase au démarrage
        async function loadHistory() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/messages?select=*&order=id.asc`, {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    }
                });
                const data = await response.json();
                
                // Afficher les messages existants
                data.forEach(msg => {
                    if (msg.role === "user") {
                        chatDiv.innerHTML += `<div class="user">Vous: ${msg.content}</div>`;
                    } else {
                        chatDiv.innerHTML += `<div class="bot">Agent: ${msg.content}</div>`;
                    }
                    history.push({ role: msg.role, content: msg.content });
                });
                chatDiv.scrollTop = chatDiv.scrollHeight;
            } catch (error) {
                console.log("Erreur chargement historique:", error);
            }
        }

        // 2. Sauvegarder un message dans Supabase
        async function saveMessage(role, content) {
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/messages`, {
                    method: "POST",
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`,
                        "Content-Type": "application/json",
                        "Prefer": "return=minimal"
                    },
                    body: JSON.stringify({ role: role, content: content })
                });
            } catch (error) {
                console.log("Erreur sauvegarde:", error);
            }
        }

        // 3. Envoyer un message et obtenir une réponse de l'IA
        async function sendMessage() {
            const userText = input.value;
            if (!userText) return;
            
            chatDiv.innerHTML += `<div class="user">Vous: ${userText}</div>`;
            input.value = '';
            
            history.push({ role: "user", content: userText });
            saveMessage("user", userText); // Sauvegarde

            try {
                // On envoie maintenant la requête à notre serveur sécurisé (api/chat.js)
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message: userText, history: history })
                });

                if (!response.ok) throw new Error(`Erreur HTTP ${response.status}`);
                const data = await response.json();
                const botText = data.reply; // On récupère la réponse du serveur
                
                chatDiv.innerHTML += `<div class="bot">Agent: ${botText}</div>`;
                history.push({ role: "assistant", content: botText });
                saveMessage("assistant", botText); // Sauvegarde
                speakText(botText); // Voix
                chatDiv.scrollTop = chatDiv.scrollHeight;

            } catch (error) {
                chatDiv.innerHTML += `<div class="bot" style="color:red;">Erreur: ${error.message}</div>`;
            }
        }

        // Fonction pour parler à voix haute
        function speakText(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            const voices = window.speechSynthesis.getVoices();
            const frenchVoice = voices.find(voice => voice.lang.startsWith('fr'));
            if (frenchVoice) {
                utterance.voice = frenchVoice;
            }
            window.speechSynthesis.speak(utterance);
        }

        // 4. Fonction Microphone (Reconnaissance vocale)
        function startListening() {
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'fr-FR';
            recognition.start();

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                input.value = transcript;
                sendMessage();
            };

            recognition.onerror = function(event) {
                alert("Micro non autorisé ou erreur : " + event.error);
            };
        }

        // Charger l'historique dès que la page est ouverte
        window.onload = loadHistory;

        input.addEventListener("keypress", function(event) {
            if (event.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
