<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoop</title>
    <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-image: linear-gradient(to left bottom, #1e3c72, #1a477d, #145288, #0c5d93, #00689d);
            color: #fff;
            max-width: 100%;
            margin: 0 auto;
            padding: 15px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            background-attachment: fixed;
        }
        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 15px;
            color: #fff;
            font-family: 'Kaushan Script', cursive;
            text-shadow: 0 4px 15px rgba(0,0,0,0.4);
            letter-spacing: 1px;
        }

        #chat::-webkit-scrollbar { width: 6px; }
        #chat::-webkit-scrollbar-track { background: transparent; }
        #chat::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 10px; }
        #chat::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.5); }

        #chat {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            height: 60vh;
            overflow-y: auto;
            padding: 20px;
            margin-bottom: 15px;
            backdrop-filter: blur(12px);
            box-shadow: inset 0 4px 20px rgba(0,0,0,0.2);
        }
        .user {
            text-align: right;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            color: white;
            padding: 12px 18px;
            border-radius: 15px 15px 0 15px;
            margin-bottom: 4px;
            display: block;
            max-width: 85%;
            margin-left: auto;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
            white-space: pre-wrap;
            font-size: 15px;
        }
        .bot {
            text-align: left;
            background: rgba(255, 255, 255, 0.95);
            color: #1e3c72;
            padding: 15px;
            border-radius: 15px 15px 15px 0;
            margin-bottom: 4px;
            display: block;
            max-width: 90%;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            line-height: 1.6;
            font-size: 15px;
        }
        .bot h1, .bot h2, .bot h3 { margin: 10px 0 5px 0; font-size: 17px; color: #145288; }
        .bot p { margin: 5px 0; }
        .bot ul { margin: 5px 0; padding-left: 20px; }
        .bot li { margin: 3px 0; }
        .bot strong { color: #145288; }

        .time {
            font-size: 11px;
            opacity: 0.65;
            text-align: center;
            margin: -6px 0 12px 0;
        }

        .table-wrapper { overflow-x: auto; margin: 10px 0; border-radius: 10px; max-width: 100%; }
        .bot table { width: 100%; border-collapse: collapse; font-size: 14px; background: #f8f9fa; color: #1e3c72; }
        .bot th { background: #1e3c72; color: #fff; padding: 10px; text-align: left; font-weight: 600; border-bottom: 2px solid #145288; }
        .bot td { padding: 10px; border-bottom: 1px solid #e0e0e0; }
        .bot tr:nth-child(even) { background: #f1f5f9; }
        .bot tr:hover { background: #e2e8f0; }

        .input-group {
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(12px);
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 100%;
        }
        input { flex: 1; padding: 12px 15px; border: none; background: transparent; outline: none; color: #fff; font-size: 15px; min-width: 0; }
        input::placeholder { color: rgba(255, 255, 255, 0.6); }

        #sendBtn {
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            background: linear-gradient(90deg, #00d2ff, #00a8cc);
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.5);
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        #voiceBtn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.5);
            position: relative;
            transition: all 0.3s ease;
        }
        #voiceBtn.speaking {
            background: linear-gradient(135deg, #ff0000, #ff9900);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
            animation: pulse 1.5s infinite;
        }
        #voiceBtn.speaking #stopIcon { fill: #fffff6; }
        #voiceBtn svg { width: 18px; height: 18px; fill: white; pointer-events: none; }
        #stopIcon { display: none; }
        #voiceBtn.speaking #microIcon { display: none; }
        #voiceBtn.speaking #stopIcon { display: block; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(255, 0, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            h1 { font-size: 26px; margin-bottom: 10px; }
            #chat { height: 55vh; padding: 15px; margin-bottom: 10px; }
            .input-group { padding: 6px; gap: 6px; }
            input { padding: 10px 12px; font-size: 14px; }
            #sendBtn { padding: 8px 12px; font-size: 12px; }
            #voiceBtn { width: 35px; height: 35px; padding: 0; }
            #voiceBtn svg { width: 16px; height: 16px; }
        }
    </style>
</head>
<body>
    <h1>Scoop</h1>
    <div id="chat"></div>

    <div class="input-group">
        <input type="text" id="userInput" placeholder="Écrivez ou parlez...">
        <button id="sendBtn" onclick="sendMessage()">Envoyer</button>
        <button id="voiceBtn" onclick="handleVoiceButton()" title="Parler / Arrêter">
            <svg id="microIcon" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
            <svg id="stopIcon" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
        </button>
    </div>

    <script>
        const chatDiv = document.getElementById('chat');
        const input = document.getElementById('userInput');
        let history = [];
        let currentAudio = null;

        // ===== 🔐 CODE D'ACCÈS =====
        let SCOOP_CODE = localStorage.getItem("scoop_code") || "";

        function askForCode() {
            SCOOP_CODE = prompt("🔐 Code d'accès :") || "";
            if (SCOOP_CODE) localStorage.setItem("scoop_code", SCOOP_CODE);
            return !!SCOOP_CODE;
        }

        function handleBadCode() {
            localStorage.removeItem("scoop_code");
            SCOOP_CODE = "";
            chatDiv.innerHTML += `<div class="bot" style="color:red;">🔐 Code invalide. Recharge la page (F5) et entre le bon code.</div>`;
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }

        // 1. Charger l'historique via l'API protégée (canal web uniquement)
        async function loadHistory() {
            try {
                const response = await fetch("/api/history?channel=web", {
                    headers: { "x-scoop-code": SCOOP_CODE }
                });
                if (response.status === 401) { handleBadCode(); return; }
                if (!response.ok) throw new Error(`Erreur HTTP ${response.status}`);

                const data = await response.json();
                (data.messages || []).forEach(msg => {
                    const t = msg.created_at ? new Date(msg.created_at).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : "";
                    const timeHtml = t ? `<div class="time">${t}</div>` : "";
                    if (msg.role === "user") {
                        chatDiv.innerHTML += `<div class="user">${msg.content}</div>${timeHtml}`;
                    } else {
                        chatDiv.innerHTML += `<div class="bot">${formatText(msg.content)}</div>${timeHtml}`;
                    }
                    history.push({ role: msg.role, content: msg.content });
                });
                chatDiv.scrollTop = chatDiv.scrollHeight;
            } catch (error) { console.log("Erreur chargement historique:", error); }
        }

        // 2. Envoyer un message
        async function sendMessage() {
            const userText = input.value;
            if (!userText) return;

            if (!SCOOP_CODE && !askForCode()) return;

            const nowUser = new Date().toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
            chatDiv.innerHTML += `<div class="user">${userText}</div><div class="time">${nowUser}</div>`;
            input.value = '';
            history.push({ role: "user", content: userText });

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "x-scoop-code": SCOOP_CODE },
                    body: JSON.stringify({ message: userText, history: history, channel: "web" })
                });

                if (response.status === 401) { handleBadCode(); return; }
                if (!response.ok) throw new Error(`Erreur HTTP ${response.status}`);

                const data = await response.json();
                const botText = data.reply;
                const botLang = data.lang;

                const nowBot = new Date().toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
                chatDiv.innerHTML += `<div class="bot">${formatText(botText)}</div><div class="time">${nowBot}</div>`;
                history.push({ role: "assistant", content: botText });

                document.getElementById('voiceBtn').classList.add('speaking');
                speakText(botText, botLang);

                chatDiv.scrollTop = chatDiv.scrollHeight;
            } catch (error) {
                chatDiv.innerHTML += `<div class="bot" style="color:red;">Erreur: ${error.message}</div>`;
                chatDiv.scrollTop = chatDiv.scrollHeight;
            }
        }

        // 3. Markdown → HTML
        function formatText(text) {
            let safeText = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

            safeText = safeText.replace(/(^\|.+\|\s*\n\|[\s:|-]+\|\s*\n(?:\|.+\|\s*\n?)*)/gm, function(tableBlock) {
                const lines = tableBlock.trim().split('\n');
                if (lines.length < 2) return tableBlock;
                const headerCells = lines[0].split('|').map(cell => cell.trim()).filter(cell => cell !== '');
                const dataRows = lines.slice(2).map(line => {
                    return line.split('|').map(cell => cell.trim()).filter(cell => cell !== '');
                });
                let html = '<div class="table-wrapper"><table><thead><tr>';
                headerCells.forEach(cell => html += `<th>${cell}</th>`);
                html += '</tr></thead><tbody>';
                dataRows.forEach(row => {
                    html += '<tr>';
                    row.forEach(cell => html += `<td>${cell}</td>`);
                    html += '</tr>';
                });
                html += '</tbody></table></div>';
                return html;
            });

            safeText = safeText.replace(/^### (.*$)/gim, '<h3>$1</h3>');
            safeText = safeText.replace(/^## (.*$)/gim, '<h2>$1</h2>');
            safeText = safeText.replace(/^# (.*$)/gim, '<h1>$1</h1>');
            safeText = safeText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            safeText = safeText.replace(/(^|\W)\*(?!\*)(\w[^*]*)\*(?=\W|$)/g, '$1<em>$2</em>');
            safeText = safeText.replace(/^\s*[-*] (.*$)/gim, '<li>$1</li>');
            safeText = safeText.replace(/(<li>.*<\/li>)/gim, '<ul>$1</ul>');
            safeText = safeText.replace(/\n/g, '<br>');
            return safeText;
        }

        // 4. Nettoyage avant lecture vocale
        function cleanTextForSpeech(text) {
            text = text.replace(/(\d{1,2}):(\d{2})/g, '$1 heures $2');
            return text
                .replace(/\*\*/g, ', ')
                .replace(/\*/g, ', ')
                .replace(/_/g, ', ')
                .replace(/#/g, '')
                .replace(/-/g, ', ')
                .replace(/\n/g, '. ')
                .replace(/\s+/g, ' ');
        }

        // 5. Lecture vocale avec découpage (limite 200 caractères)
        function speakText(text, lang) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }

            const cleanText = cleanTextForSpeech(text);
            const segments = [];
            const sentences = cleanText.split(/(?<=[.!?])\s+/);
            let currentSegment = "";

            for (const sentence of sentences) {
                if ((currentSegment + " " + sentence).length > 200) {
                    if (currentSegment) segments.push(currentSegment.trim());
                    currentSegment = sentence;
                } else {
                    currentSegment += " " + sentence;
                }
            }
            if (currentSegment.trim()) segments.push(currentSegment.trim());
            if (segments.length === 0) segments.push(cleanText);

            let currentIndex = 0;

            function playNextSegment() {
                if (currentIndex >= segments.length) {
                    currentAudio = null;
                    document.getElementById('voiceBtn').classList.remove('speaking');
                    return;
                }

                const segment = segments[currentIndex];
                currentIndex++;

                let targetLang = 'fr';
                if (lang === 'ar') targetLang = 'ar';
                if (lang === 'en') targetLang = 'en';

                const audioUrl = `/api/tts?text=${encodeURIComponent(segment)}&lang=${targetLang}`;
                const audio = new Audio(audioUrl);
                currentAudio = audio;

                if (lang === 'ar') audio.playbackRate = 1.2;
                else if (lang === 'fr') audio.playbackRate = 1.1;
                else audio.playbackRate = 1.0;

                audio.onended = () => { playNextSegment(); };
                audio.play().catch(error => {
                    console.log("Erreur lecture audio:", error);
                    playNextSegment();
                });
            }

            playNextSegment();
        }

        // 6. Microphone
        function startListening() {
            stopSpeaking();

            let lang = 'fr-FR';
            if (history.length > 0) {
                const lastText = history[history.length - 1].content;
                if (/[\u0600-\u06FF]/.test(lastText)) {
                    lang = 'ar-SA';
                } else if (/[a-zA-Z]/.test(lastText) && !/[éèêëàâäîïôöùûüç]/.test(lastText)) {
                    lang = 'en-IN';
                }
            }

            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = lang;
            recognition.start();

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                input.value = transcript;
                sendMessage();
            };

            recognition.onerror = function(event) {
                alert("Micro non autorisé ou erreur : " + event.error);
            };
        }

        function handleVoiceButton() {
            const btn = document.getElementById('voiceBtn');
            if (btn.classList.contains('speaking')) {
                stopSpeaking();
            } else {
                startListening();
            }
        }

        function stopSpeaking() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            document.getElementById('voiceBtn').classList.remove('speaking');
        }

        window.onload = async function() {
            if (!SCOOP_CODE) askForCode();
            await loadHistory();
        };
        input.addEventListener("keypress", function(event) { if (event.key === "Enter") sendMessage(); });
    </script>
</body>
</html>
