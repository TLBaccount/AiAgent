<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent IA Multilingue</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 10px; }
        #chat { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
        .user { text-align: right; color: blue; margin-bottom: 5px; }
        .bot { text-align: left; color: green; margin-bottom: 5px; }
        input, button { padding: 10px; font-size: 16px; }
        input { width: 70%; }
        button { width: 25%; background: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Agent IA</h1>
    <div id="chat"></div>
    <input type="text" id="userInput" placeholder="Écrivez votre message...">
    <button onclick="sendMessage()">Envoyer</button>

    <script>
        // IMPORTANT : On récupère la clé depuis Vercel. Si elle n'est pas trouvée, on affiche une erreur claire.
        const apiKey = import.meta.env.VITE_GROQ_API_KEY;
        
        const chatDiv = document.getElementById('chat');
        const input = document.getElementById('userInput');
        let history = [];

        async function sendMessage() {
            const userText = input.value;
            if (!userText) return;
            
            chatDiv.innerHTML += `<div class="user">Vous: ${userText}</div>`;
            input.value = '';
            
            history.push({ role: "user", content: userText });

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "llama-3.1-8b-instant",
                        messages: [
                            { role: "system", content: "Tu es un assistant personnel virtuel. Tu réponds en Français, en Arabe et en Darija Algérien selon la langue utilisée par l'utilisateur. Sois naturel, amical et précis." },
                            ...history
                        ]
                    })
                });

                // Vérifie si la réponse de l'API est correcte
                if (!response.ok) {
                    throw new Error(`Erreur HTTP ${response.status}: ${await response.text()}`);
                }

                const data = await response.json();
                
                // Vérification de sécurité pour éviter l'erreur 'reading 0'
                if (data.choices && data.choices.length > 0 && data.choices[0].message) {
                    const botText = data.choices[0].message.content;
                    chatDiv.innerHTML += `<div class="bot">Agent: ${botText}</div>`;
                    history.push({ role: "assistant", content: botText });
                } else {
                    throw new Error("Réponse inattendue de l'API Groq.");
                }
                
                chatDiv.scrollTop = chatDiv.scrollHeight;

            } catch (error) {
                chatDiv.innerHTML += `<div class="bot" style="color:red;">Erreur: ${error.message}</div>`;
            }
        }

        input.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
    </script>
</body>
</html>
