<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESSE</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: linear-gradient(to left bottom, #1e3c72, #1a477d, #145288, #0c5d93, #00689d);
            color: #fff;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            background-attachment: fixed;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        #chat {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            height: 60vh;
            overflow-y: auto;
            padding: 20px;
            margin-bottom: 15px;
            backdrop-filter: blur(12px);
        }
        .user {
            text-align: right;
            background: linear-gradient(90deg, #0270f8, #3a7bd5);
            color: white;
            padding: 10px 15px;
            border-radius: 15px 15px 0 15px;
            margin-bottom: 10px;
            display: inline-block;
            max-width: 80%;
            float: right;
            clear: both;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.2);
        }
        .bot {
            text-align: left;
            background: rgba(255, 255, 255, 0.9);
            color: #1e3c72;
            padding: 10px 15px;
            border-radius: 15px 15px 15px 0;
            margin-bottom: 10px;
            display: inline-block;
            max-width: 80%;
            float: left;
            clear: both;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        /* Zone de saisie moderne et légère */
        .input-group {
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }
        
        input {
            flex: 1;
            padding: 15px 20px;
            border: none;
            background: transparent;
            outline: none;
            color: #fff;
            font-size: 16px;
        }
        input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        
        /* Bouton Envoyer : contraste maximal + effet lumineux */
        #sendBtn {
            padding: 0 25px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            color: #fff;
            background: linear-gradient(90deg, #00d2ff, #00a8cc);
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4);
            transition: all 0.3s ease;
        }
        #sendBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 210, 255, 0.6);
        }
        
        /* Bouton Micro : fini le rouge archaïque, place à un dégradé moderne */
        #micBtn {
            width: 50px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
            transition: all 0.3s ease;
        }
        #micBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.6);
        }
        
        /* Icône du micro (SVG) */
        #micBtn svg {
            width: 20px;
            height: 20px;
            fill: white;
        }
    </style>
</head>
<body>
    <h1>ESSE</h1>
    <div id="chat"></div>
<div class="input-group">
    <input type="text" id="userInput" placeholder="Écrivez ou parlez...">
    <button id="sendBtn" onclick="sendMessage()">Envoyer</button>
    <button id="micBtn" onclick="startListening()" title="Parler">
        <svg viewBox="0 0 24 24">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
    </button>
</div>

    <script>
        // Vos informations Supabase (celles que vous avez copiées tout à l'heure)
        const SUPABASE_URL = "https://pfmgkdpvqqvlznogfuzi.supabase.co"
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBmbWdrZHB2cXF2bHpub2dmdXppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4ODE2ODIsImV4cCI6MjEwNDQ1NzY4Mn0.KAgI6CBPW9URVG0cf9qn2t2GHsgmZNCwymkuLVgojlE"; // Votre clé anon (celle qui commence par eyJ...)

        const chatDiv = document.getElementById('chat');
        const input = document.getElementById('userInput');
        let history = [];

        // 1. Charger l'historique depuis Supabase au démarrage
        async function loadHistory() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/messages?select=*&order=id.asc`, {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    }
                });
                const data = await response.json();
                
                // Afficher les messages existants
                data.forEach(msg => {
                    if (msg.role === "user") {
                        chatDiv.innerHTML += `<div class="user">Vous: ${msg.content}</div>`;
                    } else {
                        chatDiv.innerHTML += `<div class="bot">Agent: ${msg.content}</div>`;
                    }
                    history.push({ role: msg.role, content: msg.content });
                });
                chatDiv.scrollTop = chatDiv.scrollHeight;
            } catch (error) {
                console.log("Erreur chargement historique:", error);
            }
        }

        // 2. Sauvegarder un message dans Supabase
        async function saveMessage(role, content) {
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/messages`, {
                    method: "POST",
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`,
                        "Content-Type": "application/json",
                        "Prefer": "return=minimal"
                    },
                    body: JSON.stringify({ role: role, content: content })
                });
            } catch (error) {
                console.log("Erreur sauvegarde:", error);
            }
        }

        // 3. Envoyer un message et obtenir une réponse de l'IA
        async function sendMessage() {
            const userText = input.value;
            if (!userText) return;
            
            chatDiv.innerHTML += `<div class="user">Vous: ${userText}</div>`;
            input.value = '';
            
            history.push({ role: "user", content: userText });
            saveMessage("user", userText); // Sauvegarde

            try {
                // On envoie maintenant la requête à notre serveur sécurisé (api/chat.js)
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message: userText, history: history })
                });

                if (!response.ok) throw new Error(`Erreur HTTP ${response.status}`);
                const data = await response.json();
                const botText = data.reply; // On récupère la réponse du serveur
                
                chatDiv.innerHTML += `<div class="bot">Agent: ${botText}</div>`;
                history.push({ role: "assistant", content: botText });
                saveMessage("assistant", botText); // Sauvegarde
                speakText(botText); // Voix
                chatDiv.scrollTop = chatDiv.scrollHeight;

            } catch (error) {
                chatDiv.innerHTML += `<div class="bot" style="color:red;">Erreur: ${error.message}</div>`;
            }
        }

        // Fonction pour parler à voix haute
        function speakText(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            const voices = window.speechSynthesis.getVoices();
            const frenchVoice = voices.find(voice => voice.lang.startsWith('fr'));
            if (frenchVoice) {
                utterance.voice = frenchVoice;
            }
            window.speechSynthesis.speak(utterance);
        }

        // 4. Fonction Microphone (Reconnaissance vocale)
        function startListening() {
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'fr-FR';
            recognition.start();

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                input.value = transcript;
                sendMessage();
            };

            recognition.onerror = function(event) {
                alert("Micro non autorisé ou erreur : " + event.error);
            };
        }

        // Charger l'historique dès que la page est ouverte
        window.onload = loadHistory;

        input.addEventListener("keypress", function(event) {
            if (event.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
