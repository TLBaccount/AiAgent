<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent IA Multilingue</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: linear-gradient(to left bottom, #1e3c72, #1a477d, #145288, #0c5d93, #00689d);
            color: #fff;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            background-attachment: fixed;
        }
        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 20px;
            color: #fff;
            text-shadow: 0 4px 15px rgba(0,0,0,0.4);
            letter-spacing: 1px;
        }
        #chat {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            height: 60vh;
            overflow-y: auto;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(12px);
            box-shadow: inset 0 4px 20px rgba(0,0,0,0.2);
        }
        .user {
            text-align: right;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            color: white;
            padding: 15px 20px;
            border-radius: 20px 20px 0 20px;
            margin-bottom: 15px;
            display: block;
            max-width: 80%;
            margin-left: auto;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
            white-space: pre-wrap;
            font-size: 16px;
        }
        .bot {
            text-align: left;
            background: rgba(255, 255, 255, 0.95);
            color: #1e3c72;
            padding: 20px;
            border-radius: 20px 20px 20px 0;
            margin-bottom: 15px;
            display: block;
            max-width: 90%;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            line-height: 1.7;
            font-size: 16px;
        }
        .bot h1, .bot h2, .bot h3 { margin: 10px 0 5px 0; font-size: 18px; color: #145288; }
        .bot p { margin: 5px 0; }
        .bot ul { margin: 5px 0; padding-left: 20px; }
        .bot li { margin: 3px 0; }
        .bot strong { color: #145288; }
        
        /* Zone de saisie renforcée */
        .input-group {
            display: flex;
            gap: 12px;
            background: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(12px);
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        input {
            flex: 1;
            padding: 18px 20px;
            border: none;
            background: transparent;
            outline: none;
            color: #fff;
            font-size: 17px;
        }
        input::placeholder { color: rgba(255, 255, 255, 0.6); }
        
        /* Bouton Envoyer : Grand et lumineux */
        /* Bouton Envoyer : Taille réduite */
        #sendBtn {
            padding: 14px 26px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(90deg, #00d2ff, #00a8cc);
            box-shadow: 0 5px 20px rgba(0, 210, 255, 0.5);
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        
        /* Bouton Vocal Unifié : Taille réduite */
        #voiceBtn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            box-shadow: 0 5px 20px rgba(236, 72, 153, 0.5);
            position: relative;
            transition: all 0.3s ease;
        }
        
        /* Gestion des icônes (réduites aussi) */
        #voiceBtn svg { width: 22px; height: 22px; fill: white; pointer-events: none; }
        #stopIcon { display: none; }
        #voiceBtn.speaking #microIcon { display: none; }
        #voiceBtn.speaking #stopIcon { display: block; }

        /* Animation futuriste de pulsation */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 15, 123, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 15, 123, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 15, 123, 0); }
        }
    </style>
</head>
<body>
    <h1>Agent IA</h1>
        <div id="chat"></div>
    <div class="input-group">
        <input type="text" id="userInput" placeholder="Écrivez ou parlez...">
        <button id="sendBtn" onclick="sendMessage()">Envoyer</button>
        <button id="voiceBtn" onclick="handleVoiceButton()" title="Parler / Arrêter">
            <svg id="microIcon" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
            <svg id="stopIcon" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
        </button>
    </div>
    
    <script>
        // Vos informations Supabase
        const SUPABASE_URL = "https://pfmgkdpvqqvlznogfuzi.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBmbWdrZHB2cXF2bHpub2dmdXppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4ODE2ODIsImV4cCI6MjEwNDQ1NzY4Mn0.KAgI6CBPW9URVG0cf9qn2t2GHsgmZNCwymkuLVgojlE";

        const chatDiv = document.getElementById('chat');
        const input = document.getElementById('userInput');
        let history = [];

        // Fonction pour convertir le Markdown en HTML joli
        function formatText(text) {
            // Échapper les caractères HTML pour éviter les failles XSS
            let safeText = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            // Titres
            safeText = safeText.replace(/^### (.*$)/gim, '<h3>$1</h3>');
            safeText = safeText.replace(/^## (.*$)/gim, '<h2>$1</h2>');
            safeText = safeText.replace(/^# (.*$)/gim, '<h1>$1</h1>');
            // Gras
            safeText = safeText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            // Listes à puces
            safeText = safeText.replace(/^\s*[-*] (.*$)/gim, '<li>$1</li>');
            safeText = safeText.replace(/(<li>.*<\/li>)/gim, '<ul>$1</ul>');
            // Sauts de ligne
            safeText = safeText.replace(/\n/g, '<br>');
            return safeText;
        }

        // Fonction pour nettoyer le texte avant de le lire à voix haute (retirer les symboles)
        function cleanTextForSpeech(text) {
            return text
                .replace(/\*\*/g, ', ') // Remplacer les gras par des virgules
                .replace(/\*/g, ', ')
                .replace(/_/g, ', ')
                .replace(/#/g, '')
                .replace(/-/g, ', ')
                .replace(/\n/g, '. ')
                .replace(/\s+/g, ' '); // Enlever les espaces multiples
        }

        // 1. Charger l'historique
        async function loadHistory() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/messages?select=*&order=id.asc`, {
                    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
                });
                const data = await response.json();
                data.forEach(msg => {
                    if (msg.role === "user") {
                        chatDiv.innerHTML += `<div class="user">${msg.content}</div>`;
                    } else {
                        chatDiv.innerHTML += `<div class="bot">${formatText(msg.content)}</div>`;
                    }
                    history.push({ role: msg.role, content: msg.content });
                });
                chatDiv.scrollTop = chatDiv.scrollHeight;
            } catch (error) { console.log("Erreur chargement historique:", error); }
        }

        // 2. Sauvegarder un message
        async function saveMessage(role, content) {
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/messages`, {
                    method: "POST",
                    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json", "Prefer": "return=minimal" },
                    body: JSON.stringify({ role: role, content: content })
                });
            } catch (error) { console.log("Erreur sauvegarde:", error); }
        }

        // 3. Envoyer un message (ajout de la classe "speaking" au bouton)
        async function sendMessage() {
            const userText = input.value;
            if (!userText) return;
            
            chatDiv.innerHTML += `<div class="user">${userText}</div>`;
            input.value = '';
            history.push({ role: "user", content: userText });
            saveMessage("user", userText);

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: userText, history: history })
                });

                if (!response.ok) throw new Error(`Erreur HTTP ${response.status}`);
                const data = await response.json();
                const botText = data.reply;
                
                chatDiv.innerHTML += `<div class="bot">${formatText(botText)}</div>`;
                history.push({ role: "assistant", content: botText });
                saveMessage("assistant", botText);
                
                // Activation du bouton STOP visuellement
                document.getElementById('voiceBtn').classList.add('speaking');
                
                speakText(cleanTextForSpeech(botText));
                
                chatDiv.scrollTop = chatDiv.scrollHeight;
            } catch (error) {
                chatDiv.innerHTML += `<div class="bot" style="color:red;">Erreur: ${error.message}</div>`;
            }
        }

        // Fonction pour parler
        function speakText(text) {
            if (!text) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            const voices = window.speechSynthesis.getVoices();
            const frenchVoice = voices.find(voice => voice.lang.startsWith('fr'));
            if (frenchVoice) utterance.voice = frenchVoice;
            
            // Remettre le bouton en mode Micro à la fin de la lecture
            utterance.onend = () => {
                document.getElementById('voiceBtn').classList.remove('speaking');
            };
            
            window.speechSynthesis.speak(utterance);
        }

        // Fonction pour gérer le bouton combiné (Micro / Stop)
        function handleVoiceButton() {
            const btn = document.getElementById('voiceBtn');
            if (btn.classList.contains('speaking')) {
                stopSpeaking(); // Si l'agent parle, on arrête
            } else {
                startListening(); // Sinon, on lance le micro
            }
        }

        // Fonction pour ARRÊTER la voix
        function stopSpeaking() {
            window.speechSynthesis.cancel();
            document.getElementById('voiceBtn').classList.remove('speaking');
        }

        // 4. Fonction Microphone
        function startListening() {
            stopSpeaking(); // On arrête tout avant d'écouter
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'fr-FR';
            recognition.start();

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                input.value = transcript;
                sendMessage();
            };

            recognition.onerror = function(event) {
                alert("Micro non autorisé ou erreur : " + event.error);
            };
        }
        window.onload = loadHistory;
        input.addEventListener("keypress", function(event) { if (event.key === "Enter") sendMessage(); });
    </script>
</body>
</html>
