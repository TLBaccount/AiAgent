<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoop</title>
    <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-image: linear-gradient(to left bottom, #1e3c72, #1a477d, #145288, #0c5d93, #00689d);
            color: #fff;
            max-width: 100%;
            margin: 0 auto;
            padding: 15px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            background-attachment: fixed;
        }
        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 15px;
            color: #fff;
            font-family: 'Kaushan Script', cursive;
            text-shadow: 0 4px 15px rgba(0,0,0,0.4);
            letter-spacing: 1px;
        }
        
        #chat::-webkit-scrollbar {
            width: 6px;
        }
        #chat::-webkit-scrollbar-track {
            background: transparent;
        }
        #chat::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }
        #chat::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }
        
        #chat {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            height: 60vh;
            overflow-y: auto;
            padding: 20px;
            margin-bottom: 15px;
            backdrop-filter: blur(12px);
            box-shadow: inset 0 4px 20px rgba(0,0,0,0.2);
        }
        .user {
            text-align: right;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            color: white;
            padding: 12px 18px;
            border-radius: 15px 15px 0 15px;
            margin-bottom: 15px;
            display: block;
            max-width: 85%;
            margin-left: auto;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
            white-space: pre-wrap;
            font-size: 15px;
        }
        .bot {
            text-align: left;
            background: rgba(255, 255, 255, 0.95);
            color: #1e3c72;
            padding: 15px;
            border-radius: 15px 15px 15px 0;
            margin-bottom: 15px;
            display: block;
            max-width: 90%;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            line-height: 1.6;
            font-size: 15px;
        }
        .bot h1, .bot h2, .bot h3 { margin: 10px 0 5px 0; font-size: 17px; color: #145288; }
        .bot p { margin: 5px 0; }
        .bot ul { margin: 5px 0; padding-left: 20px; }
        .bot li { margin: 3px 0; }
        .bot strong { color: #145288; }
        
        /* Tableaux professionnels */
        .table-wrapper {
            overflow-x: auto;
            margin: 10px 0;
            border-radius: 10px;
            max-width: 100%;
        }
        .bot table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            background: #f8f9fa;
            color: #1e3c72;
        }
        .bot th {
            background: #1e3c72;
            color: #fff;
            padding: 10px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #145288;
        }
        .bot td {
            padding: 10px;
            border-bottom: 1px solid #e0e0e0;
        }
        .bot tr:nth-child(even) {
            background: #f1f5f9;
        }
        .bot tr:hover {
            background: #e2e8f0;
        }
        
        /* Zone de saisie adaptative */
        .input-group {
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(12px);
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 100%;
        }
        input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            background: transparent;
            outline: none;
            color: #fff;
            font-size: 15px;
            min-width: 0;
        }
        input::placeholder { color: rgba(255, 255, 255, 0.6); }
        
        /* Bouton Envoyer */
        #sendBtn {
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            background: linear-gradient(90deg, #00d2ff, #00a8cc);
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.5);
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        
        /* Bouton Vocal (Micro / Stop) */
        #voiceBtn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.5);
            position: relative;
            transition: all 0.3s ease;
        }
        /* Bouton STOP : Rouge vif vers Orange (Instagram) */
        #voiceBtn.speaking {
            background: linear-gradient(135deg, #ff0000, #ff9900);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
            animation: pulse 1.5s infinite;
        }
        #voiceBtn.speaking #stopIcon {
            fill: #fffff6;
        }
        #voiceBtn svg { width: 18px; height: 18px; fill: white; pointer-events: none; }
        #stopIcon { display: none; }
        #voiceBtn.speaking #microIcon { display: none; }
        #voiceBtn.speaking #stopIcon { display: block; }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(255, 0, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
        }
        
        @media (max-width: 600px) {
            body { padding: 10px; }
            h1 { font-size: 26px; margin-bottom: 10px; }
            #chat { height: 55vh; padding: 15px; margin-bottom: 10px; }
            .input-group { padding: 6px; gap: 6px; }
            input { padding: 10px 12px; font-size: 14px; }
            #sendBtn { padding: 8px 12px; font-size: 12px; }
            #voiceBtn { width: 35px; height: 35px; padding: 0; }
            #voiceBtn svg { width: 16px; height: 16px; }
        }
    </style>
</head>
<body>
    <h1>Scoop</h1>
    <div id="chat"></div>
    
    <div class="input-group">
        <input type="text" id="userInput" placeholder="Écrivez ou parlez...">
        <button id="sendBtn" onclick="sendMessage()">Envoyer</button>
        <button id="voiceBtn" onclick="handleVoiceButton()" title="Parler / Arrêter">
            <svg id="microIcon" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
            <svg id="stopIcon" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
        </button>
    </div>
    
    <script>
        // Vos informations Supabase
        const SUPABASE_URL = "https://pfmgkdpvqqvlznogfuzi.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBmbWdrZHB2cXF2bHpub2dmdXppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4ODE2ODIsImV4cCI6MjEwNDQ1NzY4Mn0.KAgI6CBPW9URVG0cf9qn2t2GHsgmZNCwymkuLVgojlE";

        const chatDiv = document.getElementById('chat');
        const input = document.getElementById('userInput');
        let history = [];
        let currentAudio = null;

        // 1. Charger l'historique
        async function loadHistory() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/messages?select=*&order=id.asc`, {
                    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
                });
                const data = await response.json();
                data.forEach(msg => {
                    if (msg.role === "user") {
                        chatDiv.innerHTML += `<div class="user">${msg.content}</div>`;
                    } else {
                        chatDiv.innerHTML += `<div class="bot">${formatText(msg.content)}</div>`;
                    }
                    history.push({ role: msg.role, content: msg.content });
                });
                chatDiv.scrollTop = chatDiv.scrollHeight;
            } catch (error) { console.log("Erreur chargement historique:", error); }
        }

        // 2. Sauvegarder un message
        async function saveMessage(role, content) {
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/messages`, {
                    method: "POST",
                    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json", "Prefer": "return=minimal" },
                    body: JSON.stringify({ role: role, content: content })
                });
            } catch (error) { console.log("Erreur sauvegarde:", error); }
        }

        // 3. Envoyer un message
        async function sendMessage() {
            const userText = input.value;
            if (!userText) return;
            
            chatDiv.innerHTML += `<div class="user">${userText}</div>`;
            input.value = '';
            history.push({ role: "user", content: userText });
            saveMessage("user", userText);

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: userText, history: history })
                });

                if (!response.ok) throw new Error(`Erreur HTTP ${response.status}`);
                const data = await response.json();
                const botText = data.reply;
                
                chatDiv.innerHTML += `<div class="bot">${formatText(botText)}</div>`;
                history.push({ role: "assistant", content: botText });
                saveMessage("assistant", botText);
                
                document.getElementById('voiceBtn').classList.add('speaking');
                speakText(botText);
                
                chatDiv.scrollTop = chatDiv.scrollHeight;
            } catch (error) {
                chatDiv.innerHTML += `<div class="bot" style="color:red;">Erreur: ${error.message}</div>`;
            }
        }

        // 4. Fonction pour convertir le Markdown en HTML joli
        function formatText(text) {
            let safeText = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

            safeText = safeText.replace(/(^\|.+\|\s*\n\|[\s:|-]+\|\s*\n(?:\|.+\|\s*\n?)*)/gm, function(tableBlock) {
                const lines = tableBlock.trim().split('\n');
                if (lines.length < 2) return tableBlock;
                const headerCells = lines[0].split('|').map(cell => cell.trim()).filter(cell => cell !== '');
                const dataRows = lines.slice(2).map(line => {
                    return line.split('|').map(cell => cell.trim()).filter(cell => cell !== '');
                });
                let html = '<div class="table-wrapper"><table><thead><tr>';
                headerCells.forEach(cell => html += `<th>${cell}</th>`);
                html += '</tr></thead><tbody>';
                dataRows.forEach(row => {
                    html += '<tr>';
                    row.forEach(cell => html += `<td>${cell}</td>`);
                    html += '</tr>';
                });
                html += '</tbody></table></div>';
                return html;
            });

            safeText = safeText.replace(/^### (.*$)/gim, '<h3>$1</h3>');
            safeText = safeText.replace(/^## (.*$)/gim, '<h2>$1</h2>');
            safeText = safeText.replace(/^# (.*$)/gim, '<h1>$1</h1>');
            safeText = safeText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            safeText = safeText.replace(/(^|\W)\*(?!\*)(\w[^*]*)\*(?=\W|$)/g, '$1<em>$2</em>');
            safeText = safeText.replace(/^\s*[-*] (.*$)/gim, '<li>$1</li>');
            safeText = safeText.replace(/(<li>.*<\/li>)/gim, '<ul>$1</ul>');
            safeText = safeText.replace(/\n/g, '<br>');
            return safeText;
        }

        // 5. Fonction pour nettoyer le texte avant la lecture
        function cleanTextForSpeech(text) {
            return text
                .replace(/\*\*/g, ', ')
                .replace(/\*/g, ', ')
                .replace(/_/g, ', ')
                .replace(/#/g, '')
                .replace(/-/g, ', ')
                .replace(/\n/g, '. ')
                .replace(/\s+/g, ' ');
        }

        // 6. Fonction pour parler VIA LE SERVEUR TTS
        function speakText(text) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            
            const cleanText = cleanTextForSpeech(text);
            
            let lang = 'fr';
            if (/[\u0600-\u06FF]/.test(cleanText)) {
                lang = 'ar';
            } else if (/[a-zA-Z]/.test(cleanText) && !/[éèêëàâäîïôöùûüç]/.test(cleanText)) {
                lang = 'en';
            }
            
            const audioUrl = `/api/tts?text=${encodeURIComponent(cleanText)}&lang=${lang}`;
            
            const audio = new Audio(audioUrl);
            currentAudio = audio;
            
            audio.onended = () => {
                currentAudio = null;
                document.getElementById('voiceBtn').classList.remove('speaking');
            };
            
            audio.play().catch(error => {
                console.log("Erreur lecture audio:", error);
                document.getElementById('voiceBtn').classList.remove('speaking');
            });
        }

        // 7. Fonction Microphone (adaptative selon le dernier message)
        function startListening() {
            stopSpeaking();
            
            let lang = 'fr-FR';
            if (history.length > 0) {
                const lastText = history[history.length - 1].content;
                if (/[\u0600-\u06FF]/.test(lastText)) {
                    lang = 'ar-SA';
                } else if (/[a-zA-Z]/.test(lastText) && !/[éèêëàâäîïôöùûüç]/.test(lastText)) {
                    lang = 'en-IN';
                }
            }

            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = lang;
            recognition.start();

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                input.value = transcript;
                sendMessage();
            };

            recognition.onerror = function(event) {
                alert("Micro non autorisé ou erreur : " + event.error);
            };
        }

        // 8. Fonction pour gérer le bouton combiné
        function handleVoiceButton() {
            const btn = document.getElementById('voiceBtn');
            if (btn.classList.contains('speaking')) {
                stopSpeaking();
            } else {
                startListening();
            }
        }

        // 9. Fonction pour ARRÊTER la voix
        function stopSpeaking() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            document.getElementById('voiceBtn').classList.remove('speaking');
        }

        window.onload = loadHistory;
        input.addEventListener("keypress", function(event) { if (event.key === "Enter") sendMessage(); });
    </script>
</body>
</html>
