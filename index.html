<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent IA Multilingue</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-image: linear-gradient(to left bottom, #1e3c72, #1a477d, #145288, #0c5d93, #00689d); color: #fff; max-width: 600px; margin: 0 auto; padding: 20px; height: 100vh; display: flex; flex-direction: column; box-sizing: border-box; background-attachment: fixed; }
        h1 { text-align: center; font-size: 24px; margin-bottom: 20px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        #chat { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px; height: 60vh; overflow-y: auto; padding: 20px; margin-bottom: 15px; backdrop-filter: blur(12px); }
        .user { text-align: right; background: linear-gradient(90deg, #00d2ff, #3a7bd5); color: white; padding: 10px 15px; border-radius: 15px 15px 0 15px; margin-bottom: 10px; display: block; max-width: 80%; margin-left: auto; box-shadow: 0 4px 15px rgba(0, 210, 255, 0.2); white-space: pre-wrap; }
        
        /* Styles pour les réponses de l'agent (Markdown converti en HTML) */
        .bot { text-align: left; background: rgba(255, 255, 255, 0.95); color: #1e3c72; padding: 15px; border-radius: 15px 15px 15px 0; margin-bottom: 10px; display: block; max-width: 90%; box-shadow: 0 4px 10px rgba(0,0,0,0.1); line-height: 1.6; }
        .bot h1, .bot h2, .bot h3 { margin: 10px 0 5px 0; font-size: 18px; color: #145288; }
        .bot p { margin: 5px 0; }
        .bot ul { margin: 5px 0; padding-left: 20px; }
        .bot li { margin: 3px 0; }
        .bot strong { color: #145288; }
        
        /* Zone de saisie moderne */
        .input-group { display: flex; gap: 10px; background: rgba(255, 255, 255, 0.1); padding: 8px; border-radius: 50px; border: 1px solid rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); align-items: center; }
        input { flex: 1; padding: 15px 20px; border: none; background: transparent; outline: none; color: #fff; font-size: 16px; }
        input::placeholder { color: rgba(255, 255, 255, 0.7); }
        
        /* Boutons Modernes */
        button { border: none; cursor: pointer; font-weight: bold; color: white; transition: all 0.3s ease; }
        #sendBtn { padding: 0 25px; border-radius: 50px; font-size: 16px; background: linear-gradient(90deg, #00d2ff, #00a8cc); box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4); }
        #sendBtn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 210, 255, 0.6); }
        
        /* Bouton Stop : Pour couper la voix */
        #stopBtn { width: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); }
        #stopBtn:hover { transform: scale(1.05); }
        #stopBtn svg { width: 20px; height: 20px; fill: white; }
        
        /* Bouton Micro */
        #micBtn { width: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #ec4899, #8b5cf6); box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4); }
        #micBtn:hover { transform: scale(1.05); }
        #micBtn svg { width: 20px; height: 20px; fill: white; }
    </style>
</head>
<body>
    <h1>Agent IA</h1>
    <div id="chat"></div>
    
    <div class="input-group">
        <input type="text" id="userInput" placeholder="Écrivez ou parlez...">
        <button id="sendBtn" onclick="sendMessage()">Envoyer</button>
        <button id="stopBtn" onclick="stopSpeaking()" title="Arrêter la voix">
            <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
        </button>
        <button id="micBtn" onclick="startListening()" title="Parler">
            <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        </button>
    </div>

    <script>
        // Vos informations Supabase
        const SUPABASE_URL = "https://pfmgkdpvqqvlznogfuzi.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBmbWdrZHB2cXF2bHpub2dmdXppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4ODE2ODIsImV4cCI6MjEwNDQ1NzY4Mn0.KAgI6CBPW9URVG0cf9qn2t2GHsgmZNCwymkuLVgojlE";

        const chatDiv = document.getElementById('chat');
        const input = document.getElementById('userInput');
        let history = [];

        // Fonction pour convertir le Markdown en HTML joli
        function formatText(text) {
            // Échapper les caractères HTML pour éviter les failles XSS
            let safeText = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            // Titres
            safeText = safeText.replace(/^### (.*$)/gim, '<h3>$1</h3>');
            safeText = safeText.replace(/^## (.*$)/gim, '<h2>$1</h2>');
            safeText = safeText.replace(/^# (.*$)/gim, '<h1>$1</h1>');
            // Gras
            safeText = safeText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            // Listes à puces
            safeText = safeText.replace(/^\s*[-*] (.*$)/gim, '<li>$1</li>');
            safeText = safeText.replace(/(<li>.*<\/li>)/gim, '<ul>$1</ul>');
            // Sauts de ligne
            safeText = safeText.replace(/\n/g, '<br>');
            return safeText;
        }

        // Fonction pour nettoyer le texte avant de le lire à voix haute (retirer les symboles)
        function cleanTextForSpeech(text) {
            return text
                .replace(/\*\*/g, ', ') // Remplacer les gras par des virgules
                .replace(/\*/g, ', ')
                .replace(/_/g, ', ')
                .replace(/#/g, '')
                .replace(/-/g, ', ')
                .replace(/\n/g, '. ')
                .replace(/\s+/g, ' '); // Enlever les espaces multiples
        }

        // 1. Charger l'historique
        async function loadHistory() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/messages?select=*&order=id.asc`, {
                    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
                });
                const data = await response.json();
                data.forEach(msg => {
                    if (msg.role === "user") {
                        chatDiv.innerHTML += `<div class="user">${msg.content}</div>`;
                    } else {
                        chatDiv.innerHTML += `<div class="bot">${formatText(msg.content)}</div>`;
                    }
                    history.push({ role: msg.role, content: msg.content });
                });
                chatDiv.scrollTop = chatDiv.scrollHeight;
            } catch (error) { console.log("Erreur chargement historique:", error); }
        }

        // 2. Sauvegarder un message
        async function saveMessage(role, content) {
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/messages`, {
                    method: "POST",
                    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json", "Prefer": "return=minimal" },
                    body: JSON.stringify({ role: role, content: content })
                });
            } catch (error) { console.log("Erreur sauvegarde:", error); }
        }

        // 3. Envoyer un message
        async function sendMessage() {
            const userText = input.value;
            if (!userText) return;
            
            chatDiv.innerHTML += `<div class="user">${userText}</div>`;
            input.value = '';
            history.push({ role: "user", content: userText });
            saveMessage("user", userText);

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: userText, history: history })
                });

                if (!response.ok) throw new Error(`Erreur HTTP ${response.status}`);
                const data = await response.json();
                const botText = data.reply;
                
                // Affichage stylé avec conversion Markdown
                chatDiv.innerHTML += `<div class="bot">${formatText(botText)}</div>`;
                
                history.push({ role: "assistant", content: botText });
                saveMessage("assistant", botText);
                
                // Lecture vocale nettoyée
                speakText(cleanTextForSpeech(botText));
                
                chatDiv.scrollTop = chatDiv.scrollHeight;
            } catch (error) {
                chatDiv.innerHTML += `<div class="bot" style="color:red;">Erreur: ${error.message}</div>`;
            }
        }

        // Fonction pour parler (avec nettoyage)
        function speakText(text) {
            if (!text) return;
            window.speechSynthesis.cancel(); // On coupe ce qui est en cours avant de parler
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            const voices = window.speechSynthesis.getVoices();
            const frenchVoice = voices.find(voice => voice.lang.startsWith('fr'));
            if (frenchVoice) utterance.voice = frenchVoice;
            window.speechSynthesis.speak(utterance);
        }

        // Nouvelle fonction pour ARRÊTER la voix
        function stopSpeaking() {
            window.speechSynthesis.cancel();
        }

        // 4. Fonction Microphone
        function startListening() {
            stopSpeaking(); // On arrête la voix avant d'écouter
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'fr-FR';
            recognition.start();

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                input.value = transcript;
                sendMessage();
            };

            recognition.onerror = function(event) {
                alert("Micro non autorisé ou erreur : " + event.error);
            };
        }

        window.onload = loadHistory;
        input.addEventListener("keypress", function(event) { if (event.key === "Enter") sendMessage(); });
    </script>
</body>
</html>
